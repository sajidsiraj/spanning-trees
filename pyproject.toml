[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairwise-graphs"
version = "0.1.0"
description = "Graph-theoretic analysis of pairwise comparison matrices: spanning-tree sampling, priority elicitation baselines, and consistency diagnostics."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "networkx>=3.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
